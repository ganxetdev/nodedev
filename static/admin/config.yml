backend:
  name: github
  repo: ganxetdev/nodedev
  branch: main
  base_url: https://decap-oauth.tom-gilabert.workers.dev

media_folder: static/img
public_folder: /img

collections:
  - name: "posts"
    label: "Posts"
    folder: "content/posts"
    create: true
    slug: "{{slug}}"
    fields:
      - {label: "Títol", name: "title", widget: "string"}
      - {label: "Data", name: "date", widget: "datetime", format: "YYYY-MM-DD", time_format: false}
      - {label: "Contingut", name: "body", widget: "markdown"}